<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1B2A41" />
    <title>MITA · Kampus Informatika</title>
  </head>
  <body>
    <div id="game"></div>
    <div id="title" hidden></div>
    <div id="ui">
      <div id="hud">
        <div id="place">Memuat…</div>
        <div id="chat-rule"></div>
      </div>
      <div id="account" hidden><span class="acc-name"></span><button class="logout" type="button">Keluar</button></div>
      <div id="help"><kbd>WASD</kbd>/<kbd>←↑→↓</kbd> gerak · <kbd>Shift</kbd> pelan · <kbd>E</kbd> aksi · <kbd>C</kbd> karakter · <kbd>−</kbd>/<kbd>+</kbd> zoom</div>
      <div id="prompt" hidden></div>
      <div id="pad" aria-label="Kontrol layar sentuh">
        <span></span><button data-d="up" aria-label="Atas">▲</button><span></span>
        <button data-d="left" aria-label="Kiri">◀</button><button data-a="1" class="act" aria-label="Aksi">E</button><button data-d="right" aria-label="Kanan">▶</button>
        <span></span><button data-d="down" aria-label="Bawah">▼</button><span></span>
      </div>
      <div id="loading">
        <div class="stage" aria-hidden="true"><div class="bar"><i></i></div></div>
        <p class="label" role="status">Memuat…</p>
      </div>
      <div id="error" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
