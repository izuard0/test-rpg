judul: Jumlah 1 sampai N
mataKuliah: Logika Komputasional
deskripsi: |
  Baca sebuah bilangan bulat N, lalu tulis hasil 1 + 2 + ... + N.
  Gunakan pengulangan `for`.
kodeAwal: |
  ALGORITMA:
     read(N)
     jumlah ← 0
     { lengkapi di sini }
     write(jumlah)
uji:
  - masukan: "5"
    keluaran: "15"
  - masukan: "1"
    keluaran: "1"
  - masukan: "100"
    keluaran: "5050"
# Kunci: hanya untuk memeriksa soal saat build; tidak dikirim ke browser.
kunci: |
  ALGORITMA:
     read(N)
     jumlah ← 0
     for i ← 1 to N do
        jumlah ← jumlah + i
     endfor
     write(jumlah)
